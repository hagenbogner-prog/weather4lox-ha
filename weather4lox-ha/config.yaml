name: Weather4Lox HA
version: "0.6.0"
slug: weather4lox-ha
description: >-
  Provides Home Assistant weather forecasts to Loxone Miniserver Gen 1 in
  Loxone Weather Service format, with cache, diagnostics, and an integrated
  status web interface.
url: https://github.com/hagenbogner-prog/weather4lox-ha
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:weather-partly-cloudy
panel_title: Weather4Lox
ports:
  6066/tcp: 6066
ports_description:
  6066/tcp: Loxone Weather Service HTTP API
options:
  weather_provider: openweathermap
  dwd_weather_entity: auto
  dwd_refresh_interval_minutes: 120
  dwd_cache_validity_hours: 24
  openweathermap_weather_entity: auto
  openweathermap_refresh_interval_minutes: 60
  openweathermap_cache_validity_hours: 48
  forecast_days: 7
  fallback_to_cache: true
  mqtt_entities: false
  mqtt_discovery_prefix: homeassistant
  location_city: Home
  country: ""
  country_code: ""
  latitude: 0.0
  longitude: 0.0
  elevation_m: 0
  timezone: UTC
  debug_logging: true
schema:
  weather_provider: list(openweathermap|dwd)
  dwd_weather_entity: str
  dwd_refresh_interval_minutes: int
  dwd_cache_validity_hours: int
  openweathermap_weather_entity: str
  openweathermap_refresh_interval_minutes: int
  openweathermap_cache_validity_hours: int
  forecast_days: int
  fallback_to_cache: bool
  mqtt_entities: bool
  mqtt_discovery_prefix: str
  location_city: str
  country: str
  country_code: str
  latitude: float
  longitude: float
  elevation_m: int
  timezone: str
  debug_logging: bool
