name: Weather4Lox HA
version: "0.5.0"
slug: weather4lox-ha
description: Loxone Gen 1 Weather Service emulator for Home Assistant
url: https://github.com/hagenbogner-prog/weather4lox-ha
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
ports:
  6066/tcp: 6066
ports_description:
  6066/tcp: Loxone Weather Service HTTP API
options:
  weather_provider: openweathermap
  dwd:
    weather_entity: auto
    refresh_interval_minutes: 120
    cache_validity_hours: 24
  openweathermap:
    weather_entity: auto
    refresh_interval_minutes: 60
    cache_validity_hours: 48
  forecast_days: 7
  fallback_to_cache: true
  mqtt_entities: false
  mqtt_discovery_prefix: homeassistant
  location_city: Wertingen
  country: Deutschland
  country_code: DE
  latitude: 48.56
  longitude: 10.681
  elevation_m: 450
  timezone: Europe/Berlin
  debug_logging: true
schema:
  weather_provider: list(openweathermap|dwd)
  dwd:
    weather_entity: str
    refresh_interval_minutes: int
    cache_validity_hours: int
  openweathermap:
    weather_entity: str
    refresh_interval_minutes: int
    cache_validity_hours: int
  forecast_days: int
  fallback_to_cache: bool
  mqtt_entities: bool
  mqtt_discovery_prefix: str
  location_city: str
  country: str
  country_code: str
  latitude: float
  longitude: float
  elevation_m: int
  timezone: str
  debug_logging: bool
