name: Weather4Lox HA
version: "0.3.2"
slug: weather4lox-ha
description: Loxone Gen 1 Weather Service emulator for Home Assistant OS
url: https://github.com/hagenbogner-prog/weather4lox-ha
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
homeassistant_api: true
ports:
  6066/tcp: 6066
ports_description:
  6066/tcp: Loxone Weather Service HTTP API
options:
  weather_provider: openweathermap
  weather_entity: weather.openweathermap
  dwd_weather_entity: weather.wertingen
  custom_weather_entity: weather.openweathermap
  temperature_sensor: sensor.openweathermap_temperatur
  feels_like_sensor: sensor.openweathermap_gefuhlte_temperatur
  humidity_sensor: sensor.openweathermap_luftfeuchtigkeit
  pressure_sensor: sensor.openweathermap_druck
  cloud_sensor: sensor.openweathermap_bewolkung
  wind_speed_sensor: sensor.openweathermap_windgeschwindigkeit
  wind_gust_sensor: sensor.openweathermap_windboengeschwindigkeit
  wind_direction_sensor: sensor.openweathermap_windrichtung
  rain_sensor: sensor.openweathermap_regenintensitat
  snow_sensor: sensor.openweathermap_schneeintensitat
  target_hours: 168
  cache_ttl_minutes: 60
  fallback_to_cache: true
  interpolate_missing_hours: true
  debug_logging: true
schema:
  weather_provider: list(openweathermap|dwd|custom)
  weather_entity: str
  dwd_weather_entity: str
  custom_weather_entity: str
  temperature_sensor: str
  feels_like_sensor: str
  humidity_sensor: str
  pressure_sensor: str
  cloud_sensor: str
  wind_speed_sensor: str
  wind_gust_sensor: str
  wind_direction_sensor: str
  rain_sensor: str
  snow_sensor: str
  target_hours: int
  cache_ttl_minutes: int
  fallback_to_cache: bool
  interpolate_missing_hours: bool
  debug_logging: bool
