name: Build, Verify & Auto-Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
          python -m compileall -q weather4lox-ha

      - name: Verify Code & Add-on
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config_path = Path('weather4lox-ha/config.yaml')
          data = yaml.safe_load(config_path.read_text(encoding='utf-8'))
          options = data.get('options', {})

          assert data['name'] == 'Weather4Lox HA'
          assert data['version'] == '0.3.6'
          assert int(options['target_hours']) == 181
          assert set(data['arch']) >= {'amd64', 'aarch64', 'armv7'}
          print(f"Validated Weather4Lox HA {data['version']} ({options['target_hours']} hours)")
          PY
          test -f weather4lox-ha/Dockerfile
          test -f weather4lox-ha/run.sh
          test -f weather4lox-ha/server.py
          test -f weather4lox-ha/server_035.py
          test -f weather4lox-ha/icon.png
          test -f weather4lox-ha/logo.png
          test -f weather4lox-ha/loxone_pictos.json

      - name: Build Docker image
        run: |
          VERSION=$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open('weather4lox-ha/config.yaml', encoding='utf-8'))['version'])
          PY
          )
          docker build \
            --build-arg BUILD_VERSION="$VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            -t weather4lox-ha:test \
            weather4lox-ha

      - name: Run tests if available
        run: |
          if [ -d tests ]; then
            python -m pip install pytest
            python -m pytest -q
          else
            echo 'No tests directory; structural and Docker build verification completed.'
          fi

      - name: Generate Documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          config = yaml.safe_load(Path('weather4lox-ha/config.yaml').read_text(encoding='utf-8'))
          version = str(config['version'])
          hours = int(config['options']['target_hours'])
          readme = Path('README.md')
          if not readme.exists():
              readme.write_text('# Weather4Lox HA\n\n', encoding='utf-8')
          text = readme.read_text(encoding='utf-8')
          block = ('<!-- AUTO-GENERATED: ci-docs.yml -->\n'
                   f'Current version: **{version}**  \n'
                   f'Forecast target: **{hours} hours**  \n'
                   '<!-- END AUTO-GENERATED -->')
          pattern = r'<!-- AUTO-GENERATED: ci-docs\\.yml -->.*?<!-- END AUTO-GENERATED -->'
          if re.search(pattern, text, flags=re.S):
              text = re.sub(pattern, block, text, flags=re.S)
          else:
              text = text.rstrip() + '\n\n' + block + '\n'
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Commit & Push updated documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: automatische Aktualisierung der Dokumentation [skip ci]'
          file_pattern: 'README.md docs/**/*'
